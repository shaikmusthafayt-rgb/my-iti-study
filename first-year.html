<script>
const language = document.getElementById("language");
const search = document.getElementById("search");
const questions = document.getElementById("questions");

function speak(text, lang) {
  if (!("speechSynthesis" in window)) {
    alert("Speech is not supported on this phone.");
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);

  voice.lang =
    lang === "hi" ? "hi-IN" :
    lang === "te" ? "te-IN" : "en-IN";

  voice.rate = 0.9;
  window.speechSynthesis.speak(voice);
}

function render() {
  const lang = language.value;
  const term = search.value.toLowerCase();

  questions.innerHTML = "";

  const filtered = bank.filter(item =>
    (
      item.en + item.hi + item.te +
      item.ae + item.ah + item.at +
      item.chapter
    ).toLowerCase().includes(term)
  );

  filtered.forEach((item, index) => {
    const question =
      lang === "hi" ? item.hi :
      lang === "te" ? item.te : item.en;

    const answer =
      lang === "hi" ? item.ah :
      lang === "te" ? item.at : item.ae;

    const voiceLang = lang;

    const card = document.createElement("div");
    card.className = "card";

    const chapter = document.createElement("p");
    chapter.textContent = item.chapter;

    const heading = document.createElement("h3");
    heading.textContent = (index + 1) + ". " + question;

    const questionButton = document.createElement("button");
    questionButton.className = "speaker";
    questionButton.textContent = "🔊";
    questionButton.onclick = () => speak(question, voiceLang);

    heading.appendChild(questionButton);

    const answerText = document.createElement("p");
    answerText.textContent = "Answer: " + answer;

    const answerButton = document.createElement("button");
    answerButton.className = "speaker";
    answerButton.textContent = "🔊";
    answerButton.onclick = () => speak(answer, voiceLang);

    answerText.appendChild(answerButton);

    card.appendChild(chapter);
    card.appendChild(heading);
    card.appendChild(answerText);

    questions.appendChild(card);
  });

  if (filtered.length === 0) {
    questions.textContent = "No questions found.";
  }
}

language.addEventListener("change", render);
search.addEventListener("input", render);

render();
</script>
