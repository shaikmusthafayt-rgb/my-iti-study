
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY ITI STUDY - First Year</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 15px;
}
header {
  background: #1565c0;
  color: white;
  padding: 20px;
  text-align: center;
  border-radius: 12px;
}
select, input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  box-sizing: border-box;
}
#questions {
  margin-top: 15px;
}
.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <h2>MY ITI STUDY</h2>
  <p>Electrician Trade - First Year</p>
</header>

<select id="language">
  <option value="en">English</option>
  <option value="hi">हिंदी</option>
  <option value="te">తెలుగు</option>
</select>

<input id="search" type="text" placeholder="Search Questions...">

<div id="questions"></div>

<script>
const bank = [

{
  chapter: "Basic Electricity",
  en: "What is electricity?",
  hi: "बिजली क्या है?",
  te: "విద్యుత్ అంటే ఏమిటి?",
  ae: "Electricity is a form of energy associated with electric charges.",
  ah: "बिजली विद्युत आवेशों से संबंधित ऊर्जा का एक रूप है।",
  at: "విద్యుత్ అనేది విద్యుత్ ఆవేశాలకు సంబంధించిన శక్తి రూపం."
},
{
  chapter: "Basic Electricity",
  en: "What is electric current?",
  hi: "विद्युत धारा क्या है?",
  te: "విద్యుత్ ప్రవాహం అంటే ఏమిటి?",
  ae: "Electric current is the flow of electric charge.",
  ah: "विद्युत धारा विद्युत आवेश के प्रवाह को कहते हैं।",
  at: "విద్యుత్ ఆవేశం ప్రవాహాన్ని విద్యుత్ ప్రవాహం అంటారు."
},
{
  chapter: "Basic Electricity",
  en: "What is voltage?",
  hi: "वोल्टेज क्या है?",
  te: "వోల్టేజ్ అంటే ఏమిటి?",
  ae: "Voltage is the electrical potential difference between two points.",
  ah: "वोल्टेज दो बिंदुओं के बीच विद्युत विभवांतर है।",
  at: "వోల్టేజ్ అనేది రెండు బిందువుల మధ్య విద్యుత్ పొటెన్షియల్ తేడా."
},
{
  chapter: "Basic Electricity",
  en: "What is resistance?",
  hi: "प्रतिरोध क्या है?",
  te: "రెసిస్టెన్స్ అంటే ఏమిటి?",
  ae: "Resistance is the opposition to the flow of electric current.",
  ah: "प्रतिरोध विद्युत धारा के प्रवाह का विरोध है।",
  at: "విద్యుత్ ప్రవాహానికి అడ్డంకిని రెసిస్టెన్స్ అంటారు."
},
{
  chapter: "Basic Electricity",
  en: "What is Ohm's law?",
  hi: "ओम का नियम क्या है?",
  te: "ఓమ్ నియమం అంటే ఏమిటి?",
  ae: "Ohm's law states that V = I × R.",
  ah: "ओम का नियम कहता है कि V = I × R।",
  at: "ఓమ్ నియమం ప్రకారం V = I × R."
},
{
  chapter: "Electrical Safety",
  en: "What is electrical safety?",
  hi: "विद्युत सुरक्षा क्या है?",
  te: "విద్యుత్ భద్రత అంటే ఏమిటి?",
  ae: "Electrical safety means following precautions to prevent electrical accidents.",
  ah: "विद्युत दुर्घटनाओं से बचने के लिए सावधानियाँ अपनाना विद्युत सुरक्षा है।",
  at: "విద్యుత్ ప్రమాదాలను నివారించడానికి జాగ్రత్తలు పాటించడమే విద్యుత్ భద్రత."
},
{
  chapter: "Electrical Safety",
  en: "What is PPE?",
  hi: "PPE क्या है?",
  te: "PPE అంటే ఏమిటి?",
  ae: "PPE means Personal Protective Equipment.",
  ah: "PPE का अर्थ व्यक्तिगत सुरक्षा उपकरण है।",
  at: "PPE అంటే వ్యక్తిగత రక్షణ పరికరాలు."
},
{
  chapter: "Electrical Tools",
  en: "What is a combination plier?",
  hi: "कॉम्बिनेशन प्लायर क्या है?",
  te: "కాంబినేషన్ ప్లయర్ అంటే ఏమిటి?",
  ae: "A combination plier is used for gripping, bending and cutting wires.",
  ah: "कॉम्बिनेशन प्लायर का उपयोग तार पकड़ने, मोड़ने और काटने के लिए होता है।",
  at: "వైర్లను పట్టుకోవడానికి, వంచడానికి మరియు కత్తిరించడానికి కాంబినేషన్ ప్లయర్ ఉపయోగిస్తారు."
},

{
  chapter: "Electrical Tools",
  en: "What is a hacksaw?",
  hi: "हैकसॉ क्या है?",
  te: "హ్యాక్సా అంటే ఏమిటి?",
  ae: "A hacksaw is a tool used for cutting metal.",
  ah: "हैकसॉ धातु काटने के लिए इस्तेमाल किया जाने वाला औजार है।",
  at: "లోహాన్ని కత్తిరించడానికి ఉపయోగించే పరికరాన్ని హ్యాక్సా అంటారు."
},
{
  chapter: "Wires and Cables",
  en: "What is a conductor?",
  hi: "चालक क्या है?",
  te: "వాహకం అంటే ఏమిటి?",
  ae: "A conductor allows electric current to flow through it.",
  ah: "चालक वह पदार्थ है जिसमें विद्युत धारा प्रवाहित हो सकती है।",
  at: "విద్యుత్ ప్రవాహాన్ని అనుమతించే పదార్థాన్ని వాహకం అంటారు."
},
{
  chapter: "Wires and Cables",
  en: "What is an insulator?",
  hi: "कुचालक क्या है?",
  te: "అవాహకం అంటే ఏమిటి?",
  ae: "An insulator does not allow electric current to flow easily.",
  ah: "कुचालक वह पदार्थ है जिसमें विद्युत धारा आसानी से प्रवाहित नहीं होती।",
  at: "విద్యుత్ ప్రవాహాన్ని సులభంగా అనుమతించని పదార్థాన్ని అవాహకం అంటారు."
},
{
  chapter: "Measuring Instruments",
  en: "What is an ammeter?",
  hi: "एमीटर क्या है?",
  te: "అమ్మీటర్ అంటే ఏమిటి?",
  ae: "An ammeter measures electric current and is connected in series.",
  ah: "एमीटर विद्युत धारा मापता है और इसे श्रेणी क्रम में जोड़ा जाता है।",
  at: "అమ్మీటర్ విద్యుత్ ప్రవాహాన్ని కొలుస్తుంది. దీనిని సిరీస్‌లో కలుపుతారు."
},
{
  chapter: "Measuring Instruments",
  en: "What is a voltmeter?",
  hi: "वोल्टमीटर क्या है?",
  te: "వోల్ట్మీటర్ అంటే ఏమిటి?",
  ae: "A voltmeter measures voltage and is connected in parallel.",
  ah: "वोल्टमीटर वोल्टेज मापता है और इसे समानांतर क्रम में जोड़ा जाता है।",
  at: "వోల్ట్మీటర్ వోల్టేజ్‌ను కొలుస్తుంది. దీనిని ప్యారలల్‌లో కలుపుతారు."
}
];

const language = document.getElementById("language");
const search = document.getElementById("search");
const questions = document.getElementById("questions");

function render() {
  const lang = language.value;
  const term = search.value.toLowerCase();

  questions.innerHTML = "";

  const filtered = bank.filter(item =>
    (item.en + item.hi + item.te + item.chapter +
     item.ae + item.ah + item.at).toLowerCase().includes(term)
  );

  filtered.forEach((item, index) => {
    const question = lang === "hi" ? item.hi :
                     lang === "te" ? item.te : item.en;

    const answer = lang === "hi" ? item.ah :
                   lang === "te" ? item.at : item.ae;

    const card = document.createElement("div");
    card.className = "card";

    const heading = document.createElement("h3");
    heading.textContent = (index + 1) + ". " + question;

    const chapter = document.createElement("p");
    chapter.textContent = item.chapter;

    const answerText = document.createElement("p");
    answerText.textContent = "Answer: " + answer;

    card.appendChild(chapter);
    card.appendChild(heading);
    card.appendChild(answerText);

    questions.appendChild(card);
  });

  if (filtered.length === 0) {
    questions.textContent = "No questions found.";
  }
}

language.addEventListener("change", render);
search.addEventListener("input", render);

render();
</script>
</body>
</html>
