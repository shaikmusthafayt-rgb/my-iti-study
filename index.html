
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123b70">
<title>MY ITI STUDY - First Year</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: linear-gradient(135deg, #123b70, #1976d2);
  color: white;
  text-align: center;
  padding: 28px 15px;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 8px 0 0;
  font-size: 15px;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 18px 14px;
}

.heading {
  text-align: center;
  margin: 12px 0 20px;
}

.heading h2 {
  color: #123b70;
  font-size: 22px;
  margin-bottom: 7px;
}

.heading p {
  color: #64748b;
  font-size: 14px;
}

.languages {
  display: flex;
  gap: 9px;
  justify-content: center;
  margin: 20px 0;
}

.languages button {
  flex: 1;
  max-width: 150px;
  padding: 12px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  background: white;
  color: #123b70;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.languages button.active {
  background: #123b70;
  color: white;
  border-color: #123b70;
}

.search-box {
  display: flex;
  gap: 8px;
  margin: 20px 0;
}

.search-box input {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 15px;
  outline: none;
}

.search-box input:focus {
  border-color: #1976d2;
}

.search-box button {
  padding: 12px 16px;
  background: #1976d2;
  color: white;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.card {
  background: white;
  padding: 18px;
  margin: 14px 0;
  border-radius: 12px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 3px 10px rgba(0,0,0,0.04);
}

.card h3 {
  color: #123b70;
  font-size: 18px;
  margin: 0 0 13px;
}

.answer-label {
  color: #1976d2;
  font-weight: bold;
  margin-bottom: 6px;
}

.answer {
  line-height: 1.7;
  font-size: 15px;
  margin: 0;
}

#message {
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

footer {
  background: #123b70;
  color: white;
  text-align: center;
  padding: 20px 10px;
  margin-top: 30px;
}

footer p {
  margin: 5px;
}

@media(max-width: 400px) {
  .languages {
    gap: 5px;
  }

  .languages button {
    font-size: 13px;
    padding: 11px 4px;
  }

  .search-box button {
    padding: 11px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<header>
  <h1>MY ITI STUDY</h1>
  <p>Electrician Trade - First Year</p>
</header>

<main>

  <div class="heading">
    <h2 id="pageTitle">FIRST YEAR QUESTIONS & ANSWERS</h2>
    <p id="subtitle">Select your language and study electrical questions.</p>
  </div>

  <div class="languages">
    <button class="active" id="enBtn" onclick="changeLanguage('en')">English</button>
    <button id="teBtn" onclick="changeLanguage('te')">తెలుగు</button>
    <button id="hiBtn" onclick="changeLanguage('hi')">हिंदी</button>
  </div>

  <div class="search-box">
    <input id="searchInput" type="text"
      placeholder="Search Voltage, Current, DC...">
    <button onclick="searchQuestions()" id="searchBtn">SEARCH</button>
  </div>

  <p id="message"></p>

  <div id="questions"></div>

</main>

<footer>
  <p><b>MY ITI STUDY</b></p>
  <p>Study • Learn • Improve</p>
</footer>

<script>
const questions = [
{
 enQ:"What is Electricity?",
 enA:"Electricity is a form of energy associated with electric charges.",
 teQ:"విద్యుత్ అంటే ఏమిటి?",
 teA:"విద్యుత్ అనేది విద్యుత్ ఆవేశాలకు సంబంధించిన శక్తి రూపం.",
 hiQ:"बिजली क्या है?",
 hiA:"बिजली विद्युत आवेशों से संबंधित ऊर्जा का एक रूप है।"
},
{
 enQ:"What is Voltage?",
 enA:"Voltage is the electrical potential difference between two points.",
 teQ:"వోల్టేజ్ అంటే ఏమిటి?",
 teA:"రెండు బిందువుల మధ్య విద్యుత్ పొటెన్షియల్ తేడాను వోల్టేజ్ అంటారు.",
 hiQ:"वोल्टेज क्या है?",
 hiA:"दो बिंदुओं के बीच विद्युत विभव के अंतर को वोल्टेज कहते हैं।"
},
{
 enQ:"What is Electric Current?",
 enA:"Electric current is the rate of flow of electric charge.",
 teQ:"విద్యుత్ ప్రవాహం అంటే ఏమిటి?",
 teA:"విద్యుత్ ఆవేశం ప్రవహించే రేటును విద్యుత్ ప్రవాహం అంటారు.",
 hiQ:"विद्युत धारा क्या है?",
 hiA:"विद्युत आवेश के प्रवाह की दर को विद्युत धारा कहते हैं।"
},
{
 enQ:"What is Resistance?",
 enA:"Resistance is the opposition offered to the flow of electric current.",
 teQ:"రెసిస్టెన్స్ అంటే ఏమిటి?",
 teA:"విద్యుత్ ప్రవాహానికి కలిగే ఆటంకాన్ని రెసిస్టెన్స్ అంటారు.",
 hiQ:"प्रतिरोध क्या है?",
 hiA:"विद्युत धारा के प्रवाह में होने वाली रुकावट को प्रतिरोध कहते हैं।"
},
{
 enQ:"What is Ohm's Law?",
 enA:"At constant temperature, current is directly proportional to voltage. Formula: V = I × R.",
 teQ:"ఓమ్ నియమం అంటే ఏమిటి?",
 teA:"స్థిరమైన ఉష్ణోగ్రత వద్ద విద్యుత్ ప్రవాహం వోల్టేజ్‌కు అనులోమానుపాతంలో ఉంటుంది. సూత్రం: V = I × R.",
 hiQ:"ओम का नियम क्या है?",
 hiA:"स्थिर तापमान पर धारा, वोल्टेज के समानुपाती होती है। सूत्र: V = I × R."
},
{
 enQ:"What is a Conductor?",
 enA:"A conductor is a material that allows electric current to flow through it easily.",
 teQ:"వాహకం అంటే ఏమిటి?",
 teA:"విద్యుత్ ప్రవాహం సులభంగా వెళ్లడానికి అనుమతించే పదార్థాన్ని వాహకం అంటారు.",
 hiQ:"चालक क्या है?",
 hiA:"जो पदार्थ विद्युत धारा को आसानी से प्रवाहित होने देता है, उसे चालक कहते हैं।"
},
{
 enQ:"What is an Insulator?",
 enA:"An insulator is a material that strongly opposes the flow of electric current.",
 teQ:"ఇన్సులేటర్ అంటే ఏమిటి?",
 teA:"విద్యుత్ ప్రవాహాన్ని అడ్డుకునే పదార్థాన్ని ఇన్సులేటర్ అంటారు.",
 hiQ:"कुचालक क्या है?",
 hiA:"जो पदार्थ विद्युत धारा के प्रवाह का बहुत अधिक विरोध करता है, उसे कुचालक कहते हैं।"
},
{
 enQ:"What is Direct Current (DC)?",
 enA:"Direct current flows in one direction.",
 teQ:"డైరెక్ట్ కరెంట్ (DC) అంటే ఏమిటి?",
 teA:"ఒకే దిశలో ప్రవహించే విద్యుత్ ప్రవాహాన్ని DC అంటారు.",
 hiQ:"दिष्ट धारा (DC) क्या है?",
 hiA:"जो विद्युत धारा एक ही दिशा में बहती है, उसे DC कहते हैं।"
},
{
 enQ:"What is Alternating Current (AC)?",
 enA:"Alternating current changes its direction periodically.",
 teQ:"ఆల్టర్నేటింగ్ కరెంట్ (AC) అంటే ఏమిటి?",
 teA:"సమయానుసారం తన దిశను మార్చుకునే విద్యుత్ ప్రవాహాన్ని AC అంటారు.",
 hiQ:"प्रत्यावर्ती धारा (AC) क्या है?",
 hiA:"जो विद्युत धारा समय-समय पर अपनी दिशा बदलती है, उसे AC कहते हैं।"
},
{
 enQ:"What is Electrical Power?",
 enA:"Electrical power is the rate at which electrical energy is transferred or used.",
 teQ:"విద్యుత్ శక్తి అంటే ఏమిటి?",
 teA:"విద్యుత్ శక్తి అనేది విద్యుత్ శక్తి బదిలీ లేదా వినియోగం జరిగే రేటు.",
 hiQ:"विद्युत शक्ति क्या है?",
 hiA:"विद्युत ऊर्जा के उपयोग या स्थानांतरण की दर को विद्युत शक्ति कहते हैं।"
}
];

let currentLanguage = "en";

const labels = {
 en: {
  title:"FIRST YEAR QUESTIONS & ANSWERS",
  subtitle:"Search your electrical questions below.",
  search:"Search Voltage, Current, DC...",
  button:"SEARCH",
  answer:"Answer:",
  showing:"Showing all questions.",
  notFound:"Question not found. Try another word.",
  result:"result(s) found."
 },
 te: {
  title:"మొదటి సంవత్సరం ప్రశ్నలు & సమాధానాలు",
  subtitle:"మీ విద్యుత్ ప్రశ్నలను ఇక్కడ వెతకండి.",
  search:"వోల్టేజ్, కరెంట్, DC వెతకండి...",
  button:"వెతకండి",
  answer:"సమాధానం:",
  showing:"అన్ని ప్రశ్నలు చూపబడుతున్నాయి.",
  notFound:"ప్రశ్న కనబడలేదు. మరో పదాన్ని ప్రయత్నించండి.",
  result:"ఫలితాలు కనుగొనబడ్డాయి."
 },
 hi: {
  title:"प्रथम वर्ष के प्रश्न और उत्तर",
  subtitle:"अपने विद्युत से जुड़े सवाल यहाँ खोजें।",
  search:"वोल्टेज, करंट, DC खोजें...",
  button:"खोजें",
  answer:"उत्तर:",
  showing:"सभी प्रश्न दिखाए जा रहे हैं।",
  notFound:"सवाल नहीं मिला। दूसरा शब्द खोजें।",
  result:"परिणाम मिले।"
 }
};

function changeLanguage(lang) {
 currentLanguage = lang;

 document.getElementById("enBtn").classList.toggle("active",lang==="en");
 document.getElementById("teBtn").classList.toggle("active",lang==="te");
 document.getElementById("hiBtn").classList.toggle("active",lang==="hi");

 const t = labels[lang];

 document.getElementById("pageTitle").textContent = t.title;
 document.getElementById("subtitle").textContent = t.subtitle;
 document.getElementById("searchInput").placeholder = t.search;
 document.getElementById("searchBtn").textContent = t.button;

 document.documentElement.lang = lang==="te" ? "te" : lang;
 searchQuestions();
}

function renderQuestions() {
 const container = document.getElementById("questions");
 const t = labels[currentLanguage];

 container.innerHTML = "";

 questions.forEach((q,index) => {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.search = Object.values(q).join(" ").toLowerCase();

  const question = document.createElement("h3");
  question.textContent = (index+1) + ". " + q[currentLanguage+"Q"];

  const label = document.createElement("p");
  label.className = "answer-label";
  label.textContent = t.answer;

  const answer = document.createElement("p");
  answer.className = "answer";
  answer.textContent = q[currentLanguage+"A"];

  card.append(question,label,answer);
  container.appendChild(card);
 });
}

function searchQuestions() {
 const query = document.getElementById("searchInput").value.trim().toLowerCase();
 const cards = document.querySelectorAll("#questions .card");
 const t = labels[currentLanguage];
 let found = 0;

 cards.forEach(card => {
  const match = card.dataset.search.includes(query);
  card.style.display = (!query || match) ? "block" : "none";
  if (!query || match) found++;
 });

 const message = document.getElementById("message");

 if (!query) {
  message.textContent = t.showing;
 } else if (found === 0) {
  message.textContent = t.notFound;
 } else {
  message.textContent = found + " " + t.result;
 }
}

document.getElementById("searchInput").addEventListener("input",searchQuestions);

renderQuestions();
changeLanguage("en");
</script>

</body>
</html>
