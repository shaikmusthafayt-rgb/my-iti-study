
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAIK MUSTHAFA - AI TEACHER</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#06152e,#103d65,#087e91);
 color:white;
 min-height:100vh;
}

header{
 text-align:center;
 padding:16px 10px;
 background:#06152df2;
 border-bottom:1px solid #ffffff30;
}

header h2{
 margin:0;
 color:#58e8ff;
 letter-spacing:2px;
}

header p{
 margin:6px 0 0;
 font-size:12px;
 color:#c7eaff;
}

.container{
 max-width:650px;
 margin:auto;
 padding:12px;
}

/* TEACHER ALWAYS VISIBLE */

.teacher{
 position:sticky;
 top:0;
 z-index:5;
 text-align:center;
 padding:12px 10px;
 background:linear-gradient(145deg,#164b70,#092744);
 border:1px solid #ffffff35;
 border-radius:22px;
 box-shadow:0 8px 25px #0006;
}

.online{
 color:#7dffb8;
 font-size:12px;
}

.avatar{
 width:175px;
 height:185px;
 margin:8px auto 0;
 position:relative;
 display:flex;
 justify-content:center;
}

.head{
 position:absolute;
 top:18px;
 width:116px;
 height:130px;
 border-radius:48% 48% 45% 45%;
 background:linear-gradient(120deg,#ffe5c9,#d79b75);
 border:3px solid #f7d0af;
 box-shadow:inset -10px -8px 14px #9c594455,
 0 12px 22px #0006;
}

.hair{
 position:absolute;
 top:-5px;
 left:2px;
 width:105px;
 height:43px;
 border-radius:55% 55% 20% 20%;
 background:linear-gradient(130deg,#3c3037,#10101b);
}

.eye{
 position:absolute;
 top:58px;
 width:10px;
 height:13px;
 background:#171827;
 border-radius:50%;
}

.eye.left{left:29px}
.eye.right{right:29px}

.nose{
 position:absolute;
 top:69px;
 left:53px;
 width:10px;
 height:17px;
 border-right:2px solid #b8795d;
 border-radius:50%;
}

.mouth{
 position:absolute;
 top:95px;
 left:43px;
 width:28px;
 height:10px;
 border-bottom:3px solid #883c45;
 border-radius:50%;
}

.neck{
 position:absolute;
 bottom:-18px;
 left:43px;
 width:28px;
 height:27px;
 background:#d99b76;
}

.shirt{
 position:absolute;
 top:126px;
 left:-27px;
 width:170px;
 height:57px;
 background:linear-gradient(100deg,#b6d9f3,#ffffff,#a6c9e8);
 border-radius:55px 55px 12px 12px;
 box-shadow:0 8px 15px #0005;
}

.tie{
 position:absolute;
 top:130px;
 left:48px;
 width:18px;
 height:44px;
 background:#174b8b;
 clip-path:polygon(0 0,100% 0,75% 100%,50% 85%,25% 100%);
}

.teacher-name{
 margin:3px 0;
 font-size:22px;
 font-weight:bold;
 color:#65eaff;
 letter-spacing:1px;
}

.teacher-line{
 margin:5px 0;
 font-size:13px;
 color:#e0f4ff;
}

/* CHAT AREA */

.chat{
 margin-top:12px;
 background:#ffffff12;
 border:1px solid #ffffff30;
 border-radius:20px;
 padding:13px;
}

.chat-title{
 text-align:center;
 font-size:18px;
 font-weight:bold;
 margin:5px 0 12px;
}

.messages{
 height:240px;
 overflow-y:auto;
 padding:5px;
 scroll-behavior:smooth;
}

.msg{
 padding:12px;
 margin:8px 0;
 border-radius:13px;
 line-height:1.5;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}

.bot{background:#164c70}
.user{
 background:#087c70;
 text-align:right;
}

.inputrow{
 display:flex;
 gap:7px;
 margin-top:10px;
}

input{
 flex:1;
 min-width:0;
 padding:13px;
 border:0;
 border-radius:12px;
 font-size:15px;
}

button{
 border:0;
 border-radius:12px;
 padding:12px 15px;
 font-weight:bold;
 font-size:14px;
 cursor:pointer;
}

.send{
 background:#35d8ce;
 color:#06243c;
}

.mic-area{
 text-align:center;
 margin:17px 0 10px;
}

.mic{
 width:82px;
 height:82px;
 border-radius:50%;
 background:linear-gradient(145deg,#36e5d5,#087bb7);
 color:white;
 font-size:34px;
 box-shadow:0 0 0 8px #35e5d522,
 0 10px 25px #0006;
}

.mic-text{
 margin-top:10px;
 font-size:13px;
 color:#d7efff;
}

.actions{
 text-align:center;
 margin-top:12px;
}

.actions button{
 background:#244f80;
 color:white;
}

.note{
 text-align:center;
 font-size:12px;
 color:#bdd8ee;
 line-height:1.5;
 padding:10px;
}

</style>
</head>

<body>

<header>
 <h2>MY ITI STUDY</h2>
 <p>YOUR PERSONAL AI TEACHER</p>
</header>

<div class="container">

<section class="teacher">

 <div class="online">● TEACHER PRESENT</div>

 <div class="avatar">

  <div class="shirt"></div>
  <div class="tie"></div>

  <div class="head">
   <div class="hair"></div>
   <div class="eye left"></div>
   <div class="eye right"></div>
   <div class="nose"></div>
   <div class="mouth"></div>
   <div class="neck"></div>
  </div>

 </div>

 <div class="teacher-name">
  SHAIK MUSTHAFA
 </div>

 <div class="teacher-line">
  What is your question?
 </div>

</section>

<section class="chat">

 <div class="chat-title">
  Ask Your Question
 </div>

 <div class="messages" id="messages">
  <div class="msg bot">
   Hello! I am Shaik Musthafa.
   What is your question?
  </div>
 </div>

 <div class="mic-area">
  <button class="mic" onclick="startMic()">🎙️</button>
  <div class="mic-text" id="micText">
   Tap the microphone to speak
  </div>
 </div>

 <div class="inputrow">
  <input
   id="question"
   placeholder="Type your question here..."
  >
  <button class="send" onclick="sendMessage()">
   SEND
  </button>
 </div>

 <div class="actions">
  <button onclick="clearChat()">NEW CHAT</button>
 </div>

</section>

<p class="note">
 AI connection is the next development step.
 This screen is the new teacher design.
</p>

</div>

<script>

function addMessage(text,type){
 const messages=document.getElementById("messages");
 const item=document.createElement("div");
 item.className="msg "+type;
 item.textContent=text;
 messages.appendChild(item);
 messages.scrollTop=messages.scrollHeight;
}

function sendMessage(){
 const input=document.getElementById("question");
 const q=input.value.trim();

 if(!q)return;

 addMessage(q,"user");
 input.value="";

 addMessage(
  "Your question is received. The real AI connection is not connected yet.",
  "bot"
 );
}

function startMic(){
 const micText=document.getElementById("micText");

 const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  micText.textContent=
   "Voice recognition is not supported in this browser.";
  return;
 }

 const recognition=new SpeechRecognition();

 recognition.lang="en-IN";
 recognition.interimResults=false;

 micText.textContent="Listening...";

 recognition.onresult=function(event){
  const spoken=event.results[0][0].transcript;
  document.getElementById("question").value=spoken;
  micText.textContent="Voice received. Press SEND.";
 };

 recognition.onerror=function(){
  micText.textContent="Could not hear. Please try again.";
 };

 recognition.onend=function(){};

 recognition.start();
}

function clearChat(){
 document.getElementById("messages").innerHTML=
 '<div class="msg bot">Hello! I am Shaik Musthafa. What is your question?</div>';
 document.getElementById("micText").textContent=
 "Tap the microphone to speak";
}

document.getElementById("question").addEventListener(
 "keydown",function(e){
  if(e.key==="Enter")sendMessage();
 }
);

</script>

</body>
</html>
